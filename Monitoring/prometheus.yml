
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  # PostgreSQL monitoring
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  # PgBouncer monitoring
  - job_name: pgbouncer
    static_configs:
      - targets:
          - pgbouncer-exporter:9127

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
