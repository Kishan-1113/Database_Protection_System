services:

  postgres-primary:
    image: postgres:17-alpine

    container_name: postgres-primary

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-primaryDB}

    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./Monitoring/init-monitoring.sh:/docker-entrypoint-initdb.d/zz-monitoring.sh:ro
      - ./Monitoring/monitoring.sql:/docker-entrypoint-initdb.d/monitoring.sql.in:ro

    networks:
      - app-network

    ports:
      - "5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 7
      start_period: 15s

    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres-primary
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_NAME: ${POSTGRES_DB:-primaryDB}

      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      STATS_USERS: ${POSTGRES_USER:-postgres}

      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-20}
      SERVER_LOGIN_RETRY: ${PGBOUNCER_SERVER_LOGIN_RETRY:-1}

    networks:
      - app-network

    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$$DB_USER" -d "$$DB_NAME"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    restart: unless-stopped

  app:
    build: .
    container_name: database-protection-app
    environment:
      # Spring Boot JDBC configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:5432/${POSTGRES_DB:-primaryDB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # Existing application configuration
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: "5432"
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-primaryDB}

    networks:
      - app-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ================= Monitoring Stack ==================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: "postgres-primary:5432/${POSTGRES_DB:-primaryDB}?sslmode=disable"
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD must be set}
    networks:
      - app-network
      - monitoring-network
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.11.0
    container_name: pgbouncer-exporter
    command:
      - "--pgBouncer.connectionString=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@pgbouncer:5432/pgbouncer?sslmode=disable"
    networks:
      - app-network
      - monitoring-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    volumes:
      - ./Monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - monitoring-network
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-network
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  primary_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge

  monitoring-network:
    driver: bridge
