spring.application.name=database_protection_system

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${PGBOUNCER_HOST:localhost}:${PGBOUNCER_PORT:5432}/${POSTGRES_DB:PrimaryDB(DPS)}

spring.datasource.username=${POSTGRES_USER:payments_app}

spring.datasource.password=${POSTGRES_PASSWORD:this_is_the_password}
spring.jpa.hibernate.ddl-auto=update
